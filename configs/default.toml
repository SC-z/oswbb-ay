[meminfo]
enabled = true
available_warn_pct = 20
available_soft_pct = 30
available_severe_pct = 10
available_severe_mb = 8192
available_warn_mb = 16384
anon_leak_hard_mb = 200
anon_leak_soft_mb = 128
anon_leak_delta_mb = 200
anon_leak_hard_rate_mb_per_sample = 50
anon_leak_soft_rate_mb_per_sample = 20
