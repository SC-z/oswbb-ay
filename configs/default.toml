swap_growth_soft_mb = 128
swap_burst_pct = 20
commit_warn_pct = 90
commit_hard_pct = 100
slab_warn_mb = 20480
slab_soft_mb = 10240
slab_warn_pct = 8
slab_soft_pct = 4
unreclaim_warn_pct = 2
unreclaim_soft_pct = 1
